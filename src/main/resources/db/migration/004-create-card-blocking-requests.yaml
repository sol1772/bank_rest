databaseChangeLog:
  - changeSet:
      id: 004-create-card-blocking-requests
      author: sol

      changes:
        - createTable:
            tableName: card_blocking_requests
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true

              - column:
                  name: card_id
                  type: BIGINT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: request_status
                  type: VARCHAR(50)

        - addForeignKeyConstraint:
            baseTableName: card_blocking_requests
            baseColumnNames: card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_blocking_card